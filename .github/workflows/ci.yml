name: ci

# Type-check + lint + unit tests on every push/PR. A full `next build`
# is deliberately NOT run here: prerendering reads the database (pricing
# catalog) and needs production env vars — Vercel runs it on every push
# anyway and the deploy fails if the build breaks. This workflow catches
# type/lint/test regressions before they reach the Vercel build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # postinstall runs `prisma generate` — the generated client in
      # src/generated/prisma is a prerequisite for tsc.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # TODO: switch to blocking once the existing 26 lint errors are
      # cleared (mostly react-hooks/refs in older client components) —
      # state as of 2026-07-03.
      - name: Lint (non-blocking until existing debt is cleared)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test
