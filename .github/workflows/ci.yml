name: ci

# Type-check + lint + unit testovi na svaki push/PR. Puni `next build`
# namerno NIJE ovde: prerender čita bazu (katalog cena) i traži
# produkcijske env varove — njega ionako izvršava Vercel na svakom
# pushu i deploy pada ako build pukne. Ovaj workflow hvata type/lint/test
# regresije pre nego što stignu do Vercel builda.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # postinstall pokreće `prisma generate` — generisani klijent u
      # src/generated/prisma je preduslov za tsc.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # TODO: prebaciti na blocking kad se očisti postojećih 26 lint
      # grešaka (uglavnom react-hooks/refs u starijim klijentskim
      # komponentama) — 2026-07-03 stanje.
      - name: Lint (non-blocking dok se ne očisti postojeći dug)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      # Čist skript bez env/DB — čuva NestPay hash format (BIB template).
      - name: NestPay hash sanity
        run: npx tsx scripts/nestpay-hash-test.ts
