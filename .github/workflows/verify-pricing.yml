name: verify pricing engine

# Runs the pricing-engine smoke test from scripts/verify-pricing.ts on
# every PR. The script exercises cross-product discount cases (Rule 1+2
# bidirectional, Rule 3 external sources, Rule 4 active-project boost
# with cap, source-mode-aware anim resolution) without touching the DB.
# Catches regressions in calculate.ts / configurator.ts before they
# reach main.

on:
  pull_request:
    paths:
      - "src/lib/catalog/**"
      - "scripts/verify-pricing.ts"
      - ".github/workflows/verify-pricing.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run pricing verifier
        run: npx tsx scripts/verify-pricing.ts
